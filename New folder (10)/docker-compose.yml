services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant_server:/qdrant/storage
  app:
    build: .
    env_file: .env
    environment:
      - SB_QDRANT_URL=http://qdrant:6333
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
